name: Install production site package

on:
  push:
    branches: [main]
    paths:
      - '.deploy/**'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild site package
        shell: bash
        run: |
          set -euo pipefail
          cat .deploy/part* > /tmp/site.b64
          base64 -d /tmp/site.b64 > /tmp/site.zip
          rm -rf /tmp/site
          mkdir -p /tmp/site
          unzip -q /tmp/site.zip -d /tmp/site
          src="/tmp/site/DBVirtualSolutions_UIUX_ProMax_V3.5"
          test -f "$src/index.html"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name '.deploy' -exec rm -rf {} +
          cp -a "$src"/. ./
          rm -rf .deploy .github README.md

      - name: Commit production tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish DB Virtual Solutions V3.5"
          git push
