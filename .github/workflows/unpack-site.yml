name: Install production site package

on:
  push:
    branches: [main]
    paths:
      - '.deploy/**'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install final V3.5 production tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/site
          mkdir -p /tmp/site
          tar -xzf .deploy/site.tar.gz -C /tmp/site
          test -f /tmp/site/index.html
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name '.deploy' -exec rm -rf {} +
          cp -a /tmp/site/. ./
          rm -rf .deploy .github README.md

      - name: Commit production tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish DB Virtual Solutions V3.5 final"
          git push
